name: dev test

on:
  push:
    branches: [cache]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: posix
            install: sh install.sh
            test: sh test.sh
          - name: pmemkv
            install: sh install.sh pmemkv
            test: sh test.sh
          # MPI, IOR and others are not built with AddressSanitizer
          - name: asan
            install: SANITIZE=address sh install-chfs.sh
            test: sh test-asan.sh
    name: test (${{ matrix.name }})
    env:
      INSTALL: ${{ matrix.install }}
      TEST: ${{ matrix.test }}
    defaults:
      run:
        working-directory: dev
    steps:
      - uses: actions/checkout@v4

      - name: Set up the user
        run: |
          echo "USER=$(id -un)" >> $GITHUB_ENV
          echo "UID_NUM=$(id -u)" >> $GITHUB_ENV
          # login shells in containers do not read .bashrc
          echo "CENV=export LC_ALL=C PATH=\$HOME/local/bin:\$PATH LD_LIBRARY_PATH=\$HOME/local/lib PKG_CONFIG_PATH=\$HOME/local/lib/pkgconfig" >> $GITHUB_ENV

      - name: Load the FUSE module
        run: |
          sudo modprobe fuse
          ls -l /dev/fuse

      - uses: docker/setup-buildx-action@v3

      - name: Build the docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dev/Dockerfile
          build-args: |
            USERNAME=${{ env.USER }}
            UID=${{ env.UID_NUM }}
          tags: chfs
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start containers
        run: docker compose up -d --no-build

      # Open MPI takes most of the install time.  It is built with
      # ROMIO for CHFS, which depends on lib/chfs.h
      - name: Cache Open MPI
        if: matrix.name != 'asan'
        uses: actions/cache@v4
        with:
          path: dev/ompi-install.tar
          key: ompi-${{ hashFiles('dev/Dockerfile', 'dev/install-ompi.sh', 'dev/ompi/ad_chfs-5.0.patch', 'lib/chfs.h') }}

      - name: Install
        run: |
          docker exec -u $USER -w /home/$USER/chfs/dev chfs-c1 \
            bash -c "$CENV; export OMPI_ARCHIVE=\$PWD/ompi-install.tar; $INSTALL"

      - name: Test
        timeout-minutes: 60
        run: |
          docker exec -u $USER -w /home/$USER/chfs/dev chfs-c1 \
            bash -c "$CENV; $TEST"

      # chfsd logs of test-start.sh and reports of AddressSanitizer
      - name: Upload logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: dev-log-${{ matrix.name }}
          path: dev/log
          if-no-files-found: ignore

      - name: Stop containers
        if: always()
        run: docker compose down -v
